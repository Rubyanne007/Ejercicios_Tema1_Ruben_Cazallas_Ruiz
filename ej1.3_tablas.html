<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio 3 - Tablas</title>
    <link rel="stylesheet" href="css/tablas.css">
</head>
<body>
    <h3>Tabla prueba 1</h3>

        <tr>
            <th>columna 1</th>
            <th>columna 2</th>
            <th>columna 3</th>
            <th>columna 4</th>
        </tr>
        <tr>
            <td>col1</td>

            <td>colum1</td>
            <td>colum2</td>
            <td>colum4</td>
        </tr>

            <th>columna 1</th>
            <th>columna 2</th>
            <th>columna 3</th>
            <th>columna 4</th>
        </tr>
        <tr class="verde">
            <td>col1</td>
            <td colspan="2">col2</td>
            <td>col3</td>
        </tr>
        <tr class="gris">
            <td>colum1</td>
            <td rowspan="2">colum2</td>
            <td>colum3</td>
            <td>colum4</td>
        </tr>
        <tr class="verde">
            <td>column1</td>
            <td>column3</td>
            <td>column4</td>
        </tr>
        <tr class="gris">
            <td>colu1</td>
            <td>colu2</td>

            <td>colu4</td>
        </tr>
    </table>
